[project]
name = "ZLabel"
version = "0.3.4"
description = "ZLabel"
authors = [{ name = "rainyl", email = "rainyliusy3@gmail.com" }]
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "Pillow<13.0.0,>=10.1.0",
    "pyside6<7.0.0,>=6.6.1",
    "pydantic<3.0.0,>=2.5.2",
    "requests<3.0.0,>=2.31.0",
    "numpy>=2.2.6",
    "shapely>=2.1.2",
    "opencv-python-headless>=5.0.0.93",
    "protobuf>=7.35.1",
    "MNN>=3.6.0",
    "regex",
    "pyqtgraph",
]

[dependency-groups]
dev = [
    "nuitka>=2.7.2",
    "py7zr>=1.0.0",
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "pytest-qt>=4.4.0",
    "rich<16.0.0,>=13.7.0",
    "tqdm>=4.67.1",
    "cx-freeze>=8.7.0",
    "tomli>=2.3.0",
    "ruff>=0.14.0",
]

[tool.uv.sources]
pyqtgraph = { git = "https://gh-proxy.org/https://github.com/pyqtgraph/pyqtgraph", rev = "dc8e538b51a2ee43ebe4730dbcf13714961f8fd2" }

[project.scripts]
zlabel-build = "zlabel.scripts:build"
zlabel-build-nuitka = "zlabel.scripts:build_nuitka"
zlabel-uic = "zlabel.scripts:uic_rcc"
zlabel-translate = "zlabel.scripts:translate"

[project.gui-scripts]
zlabel = "zlabel.main:main"

[build-system]
requires = ["uv_build>=0.4"]
build-backend = "uv_build"


# [[tool.uv.index]]
# name = "tsinghua"
# url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 120
# Enable preview features.
preview = true
# Generated Qt output is not hand-written and must not be linted/formatted.
extend-exclude = [
    "zlabel/widgets/ui/**",
    "icons_rc.py",
    "build/",
    "dist/",
    "3rd_party/"
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
    "B905",
    "E712",
    "UP015",
    "F401",
]

[tool.ruff.lint.per-file-ignores]
# ported ctypes bindings from WeChat-Local-OCR-Serve (keep upstream style)
"zlabel/utils/wechat_ocr/**" = ["E", "W", "F", "I", "UP", "B", "C4", "ARG001"]
# session-scoped home-dir redirect must run before zlabel imports
"tests/conftest.py" = ["E402"]

[tool.pyright]
defineConstant = { PYQT5 = false, PYSIDE6 = true, PYSIDE2 = false, PYQT6 = false }
reportUnannotatedClassAttribute = false
reportUnusedCallResult = false
reportUnknownMemberType = false
reportImplicitOverride = false
reportUnknownLambdaType = false
reportImportCycles = false
reportExplicitAny = false
reportUnusedImport = false
reportMissingTypeStubs = false

[tool.mypy]
exclude = [
    "^zlabel/widgets/ui/",
    "^zlabel/models/",
    "^zlabel/utils/wechat_ocr/",
    "^tests/",
    "^dist/",
    "^build/",
]
disable_error_code = ["import-untyped"]
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: requires onnx models in data/ (gitignored)",
]
filterwarnings = [
    "ignore:Specified provider 'CUDAExecutionProvider':UserWarning",
]
