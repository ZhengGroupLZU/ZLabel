[project]
name = "ZLabel"
version = "0.2.2"
description = "ZLabel"
authors = [{ name = "rainyl", email = "rainyliusy3@gmail.com" }]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "Pillow<13.0.0,>=10.1.0",
    "pyside6<7.0.0,>=6.6.1",
    "rich<16.0.0,>=13.7.0",
    "pydantic<3.0.0,>=2.5.2",
    "requests<3.0.0,>=2.31.0",
    "pyqtgraph<1.0.0,>=0.14.0",
    "numpy>=2.2.6",
    "shapely>=2.1.2",
]

[project.optional-dependencies]
local = [
    "onnxruntime>=1.19.0",
    "opencv-python-headless>=4.11.0.86",
]
local-gpu = [
    "onnxruntime-gpu>=1.22.0",
    "opencv-python-headless>=4.11.0.86",
]

[dependency-groups]
dev = [
    # "PyYAML<7.0.0,>=6.0.1",
    # "pyinstaller-versionfile>=2.1.1,<3.0.0",
    "nuitka>=2.7.2",
    "py7zr>=1.0.0",
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "poethepoet>=0.37.0",
    "typed-argument-parser>=1.11.0",
    # "pyinstaller<7.0.0,>=6.3.0",
    "tqdm>=4.67.1",
    "imageio>=2.37.0",
    "cx-freeze>=8.4.1",
    "tomli>=2.3.0",
    "ruff>=0.14.0",
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

[tool.ruff]
line-length = 120
# Enable preview features.
preview = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
    "B905",
    "E712",
    "UP015",
    "F401",
]

[tool.pyright]
defineConstant = { PYQT5 = false, PYSIDE6 = true, PYSIDE2 = false, PYQT6 = false }
reportUnannotatedClassAttribute = false
reportUnusedCallResult = false
reportUnknownMemberType = false
reportImplicitOverride = false
reportUnknownLambdaType = false
reportImportCycles = false
reportExplicitAny = false
reportUnusedImport = false
reportMissingTypeStubs = false

[tool.mypy]
exclude = [
    "^zlabel/widgets/ui/",
    "^zlabel/models/",
    "^tests/",
    "^dist/",
    "^build/",
]
disable_error_code = ["import-untyped"]
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: requires onnx models in data/ (gitignored)",
]
filterwarnings = [
    "ignore:Specified provider 'CUDAExecutionProvider':UserWarning",
]

[tool.poe.tasks]
run = "uv run python zlabel.py"
build = """uv run python ./setup.py build_exe"""

designer = "uv run pyside6-designer.exe"
designer_macos = "open .venv/lib/python3.10/site-packages/PySide6/Designer.app"
uic_rcc = "uv run python ./uic_rcc.py"
translate = "uv run pyside6-lrelease i18n/zh_CN.ts -qm i18n/zh_CN.qm"
